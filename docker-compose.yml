services:

  pecae-redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pecae-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3000
      - SERVER_PORT=3000
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.hsxeulvcfrbyvxehhhaj:db_coolify_pecae@aws-1-us-east-2.pooler.supabase.com:6543/postgres}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&preferQueryMode=simple&stringtype=unspecified}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres.hsxeulvcfrbyvxehhhaj}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-db_coolify_pecae}
      - REDIS_HOST=pecae-redis
      - REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=pecae-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@pecae.com.br}
      - STORAGE_TYPE=${STORAGE_TYPE:-mock}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.services.https-0-jn38h7vp5ne48tb4668p5mgh-api.loadbalancer.server.port=3000
      - traefik.http.routers.https-0-jn38h7vp5ne48tb4668p5mgh-api.service=api
      - traefik.http.services.jn38h7vp5ne48tb4668p5mgh-api.loadbalancer.server.port=3000
      - traefik.http.routers.pecae-api.rule=Host(`api-pecae.italohub.cloud`)
      - traefik.http.routers.pecae-api.entrypoints=https
      - traefik.http.routers.pecae-api.tls=true
      - traefik.http.routers.pecae-api.tls.certresolver=letsencrypt
      - traefik.http.routers.pecae-api.priority=1000
      - traefik.http.routers.pecae-api.service=api
      - traefik.http.services.pecae-api.loadbalancer.server.port=3000
      - traefik.docker.network=coolify
    depends_on:
      - pecae-redis
    networks:
      - pecae-network
      - coolify

  web-frontend:
    build:
      context: .
      dockerfile: web-frontend/Dockerfile
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api-pecae.italohub.cloud/api/v1
      - EXPO_PUBLIC_API_URL=https://api-pecae.italohub.cloud/api/v1
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    labels:
      - traefik.enable=true
      - traefik.http.services.web-frontend.loadbalancer.server.port=3000
      - traefik.http.services.https-0-jn38h7vp5ne48tb4668p5mgh-web-frontend.loadbalancer.server.port=3000
      - traefik.http.routers.https-0-jn38h7vp5ne48tb4668p5mgh-web-frontend.service=web-frontend
      - traefik.http.services.jn38h7vp5ne48tb4668p5mgh-web-frontend.loadbalancer.server.port=3000
      - traefik.http.services.https-0-jn38h7vp5ne48tb4668p5mgh-web.loadbalancer.server.port=3000
      - traefik.http.routers.https-0-jn38h7vp5ne48tb4668p5mgh-web.service=web-frontend
      - traefik.http.services.jn38h7vp5ne48tb4668p5mgh-web.loadbalancer.server.port=3000
      - traefik.http.routers.pecae-web.rule=Host(`pecae.italohub.cloud`)
      - traefik.http.routers.pecae-web.entrypoints=https
      - traefik.http.routers.pecae-web.tls=true
      - traefik.http.routers.pecae-web.tls.certresolver=letsencrypt
      - traefik.http.routers.pecae-web.priority=1000
      - traefik.http.routers.pecae-web.service=web-frontend
      - traefik.http.services.pecae-web.loadbalancer.server.port=3000
      - traefik.docker.network=coolify
    depends_on:
      - api
    networks:
      - pecae-network
      - coolify

volumes:
  redis_data:
  postgres_data:

networks:
  pecae-network:
    driver: bridge
  coolify:
    external: true
